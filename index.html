<!DOCTYPE html>
<html lang="it">
<head>
<title>Claudio Zaia | Video editor e AI filmmaker</title>
<meta name="description" content="Portfolio di Claudio Zaia, video editor e AI filmmaker. Brand, video musicali, social media e video con AI.">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ECEEF2; --white: #FFFFFF; --ink: #0F1E3D; --muted: #55607A;
    --accent: #2F3CFF; --line: #C9CEDA;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Hanken Grotesk", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

  header.top { display: flex; justify-content: space-between; align-items: center; padding: 24px 0; }
  header.top .name { font-family: var(--display); font-size: 1.25rem; font-weight: 800; text-decoration: none; letter-spacing: -0.01em; }
  header.top nav { display: flex; gap: 28px; }
  header.top nav a { text-decoration: none; color: var(--muted); font-weight: 600; }
  header.top nav a:hover { color: var(--accent); }
  header.top nav a[aria-current="page"] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 3px; text-underline-offset: 8px; }

  .frame { position: relative; aspect-ratio: 16 / 9; background: var(--ink); border-radius: 6px; overflow: hidden; }
  .frame iframe, .frame img { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; object-fit: cover; }
  .frame img { transition: transform .5s ease, opacity .4s ease; }
  .frame:hover img { transform: scale(1.03); }
  .frame button.play { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(to top, rgba(15,30,61,.35), rgba(15,30,61,0) 55%); }
  .frame button.play span { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,.92); color: var(--ink); transition: transform .2s ease, background .2s ease, color .2s ease; }
  .frame button.play.big span { width: 84px; height: 84px; }
  .frame button.play:hover span { transform: scale(1.1); background: var(--accent); color: var(--white); }
  .frame button.play svg { width: 22px; height: 22px; fill: currentColor; margin-left: 3px; }
  .frame button.play.big svg { width: 30px; height: 30px; }
  @media (prefers-reduced-motion: reduce) { .frame img, .frame button.play span { transition: none; } .frame:hover img { transform: none; } }
  .frame .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #B9C2DA;
    background: repeating-linear-gradient(135deg, rgba(255,255,255,.04) 0 14px, transparent 14px 28px), var(--ink); }

  footer.site { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 16px; border-top: 1px solid var(--line); margin-top: 96px; padding: 28px 0 48px; color: var(--muted); font-size: 0.9375rem; }
  footer.site span { display: flex; gap: 24px; }
  footer.site a { text-decoration: none; }
  footer.site a:hover { color: var(--accent); }

  @media (max-width: 760px) { header.top nav { gap: 18px; } }
  .intro { padding: 40px 0 8px; }
  .intro h1 { font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 4.6vw, 3.5rem); line-height: 1.05; letter-spacing: -0.025em; max-width: 22ch; }
  .intro h1 span { color: var(--accent); }

  .filters { display: flex; flex-wrap: wrap; gap: 10px; margin: 40px 0 32px; }
  .filters button { font-family: var(--body); font-weight: 600; font-size: 0.9375rem; color: var(--ink); background: transparent; border: 1px solid var(--line); padding: 8px 18px; border-radius: 999px; cursor: pointer; }
  .filters button:hover { border-color: var(--ink); }
  .filters button[aria-pressed="true"] { background: var(--ink); color: var(--white); border-color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px 24px; }
  .clip .frame { border-radius: 4px; }
  .clip .frame button.play span { padding: 10px 18px; font-size: 0.9375rem; }
  .clip .tag { display: block; margin-top: 14px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); }
  .clip h3 { font-family: var(--display); font-weight: 600; font-size: 1.1875rem; line-height: 1.25; margin-top: 4px; }
  .clip p { color: var(--muted); font-size: 0.9375rem; }

  @media (max-width: 980px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } .intro { padding-top: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="name" href="/">Claudio Zaia</a>
    <nav aria-label="Menu">
      <a href="/" aria-current="page">Work</a>
      <a href="/reel">Reel</a>
      <a href="/about">About</a>
    </nav>
  </header>
  <main>
    <section class="intro">
      <h1><span>Video editor</span> e AI filmmaker.</h1>
    </section>
    <div class="filters" id="filtri" role="group" aria-label="Filtra i lavori"></div>
    <div class="grid" id="grid"></div>
  </main>
  <footer class="site">
    <a href="mailto:claudiozaiavideo@gmail.com">claudiozaiavideo@gmail.com</a>
    <span>
      <a href="https://www.linkedin.com/in/claudiozaiafilm/">LinkedIn</a>
      <a href="https://vimeo.com/claudiozaia">Vimeo</a>
    </span>
  </footer>
</div>

<script>
/* ============================================================
   DA MODIFICARE: i tuoi lavori.
   Per ogni video: titolo, dettaglio, categoria e link (Vimeo o YouTube).
   Categorie possibili: "commerciali", "musica", "social", "ai".
   Un filtro compare in alto solo se ha almeno un video.
   Copertina (facoltativa): carica un'immagine su GitHub e aggiungi
   img: "nomefile.jpg" alla riga del video. Se non c'e', il sito usa
   la copertina che hai scelto su Vimeo o YouTube.
   Ogni riga finisce con la virgola, tranne l'ultima.
   ============================================================ */
const LAVORI = [
  { titolo: "Calvin Klein - Overall", dettaglio: "Calvin Klein, edit", categoria: "commerciali", yt: "https://vimeo.com/312907256" },
  { titolo: "Adidas - Claim Your Trophy", dettaglio: "Adidas, edit", categoria: "commerciali", yt: "https://vimeo.com/312907126" },
  { titolo: "OUR EARTH - Iris Van Herpen", dettaglio: "Future Frank, creative direction + edit", categoria: "commerciali", yt: "https://vimeo.com/312907019" },
  { titolo: "NikeSB - CPH Open Tour", dettaglio: "Nike, creative direction + edit", categoria: "commerciali", yt: "https://vimeo.com/312906534" },
  { titolo: "Absolute - Tomorrowland", dettaglio: "Absolute, edit", categoria: "commerciali", yt: "https://vimeo.com/422467738" },
  { titolo: "Goldband - Alles Kapot", dettaglio: "Video musicale, 1,4 milioni di views", categoria: "musica", yt: "https://www.youtube.com/watch?v=MZnHEy-FIKs" },
  { titolo: "Sidel Infissi", dettaglio: "Digitalia, direzione creativa AI", categoria: "ai", yt: "https://vimeo.com/1228917833" },
  { titolo: "Mionetto 2026", dettaglio: "Awom, mixed media e AI", categoria: "ai", yt: "https://vimeo.com/1228916392" },
  { titolo: "Bibanesi", dettaglio: "Awom, ideazione e creazione AI", categoria: "ai", yt: "https://vimeo.com/1228918082" }
];

/* ---- da qui in giu' non serve toccare nulla ---- */
const CATEGORIE = [
  { id: "commerciali", nome: "Brand" },
  { id: "musica", nome: "Video musicali" },
  { id: "social", nome: "Social media" },
  { id: "ai", nome: "AI" }
];
const PLAY_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>';

function leggiVideo(v) {
  if (!v) return null;
  v = String(v).trim();
  let m = v.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([a-z0-9]+))?/i);
  if (m) {
    const h = m[2] || (v.match(/[?&]h=([a-z0-9]+)/i) || [])[1] || "";
    return { tipo: "vimeo", id: m[1], h: h };
  }
  if (/^\d+$/.test(v)) return { tipo: "vimeo", id: v, h: "" };
  m = v.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/);
  if (m) return { tipo: "youtube", id: m[1] };
  if (/^[A-Za-z0-9_-]{11}$/.test(v)) return { tipo: "youtube", id: v };
  return null;
}

function buildFrame(el, valore, label, big, copertina) {
  const v = leggiVideo(valore);
  if (!v) { el.innerHTML = '<div class="empty"><p>Video da aggiungere</p></div>'; return; }
  el.innerHTML = '<img alt="" style="opacity:0">' +
    '<button class="play' + (big ? ' big' : '') + '" type="button" aria-label="Guarda: ' + label + '"><span>' + PLAY_ICON + '</span></button>';
  const img = el.querySelector("img");
  img.addEventListener("load", function () {
    if (v.tipo === "youtube" && img.naturalWidth <= 120 && img.src.indexOf("maxresdefault") > -1) {
      img.src = "https://img.youtube.com/vi/" + v.id + "/hqdefault.jpg";
      return;
    }
    img.style.opacity = "1";
  });
  img.addEventListener("error", function () {
    if (v.tipo === "youtube" && img.src.indexOf("maxresdefault") > -1) img.src = "https://img.youtube.com/vi/" + v.id + "/hqdefault.jpg";
  });
  if (copertina) {
    img.src = copertina;
  } else if (v.tipo === "youtube") {
    img.src = "https://img.youtube.com/vi/" + v.id + "/maxresdefault.jpg";
  } else {
    const url = "https://vimeo.com/" + v.id + (v.h ? "/" + v.h : "");
    fetch("https://vimeo.com/api/oembed.json?width=1280&url=" + encodeURIComponent(url))
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d && d.thumbnail_url) img.src = d.thumbnail_url; })
      .catch(function () {});
  }
  el.querySelector("button").addEventListener("click", function () {
    const src = v.tipo === "youtube"
      ? "https://www.youtube-nocookie.com/embed/" + v.id + "?autoplay=1&rel=0"
      : "https://player.vimeo.com/video/" + v.id + "?autoplay=1" + (v.h ? "&h=" + v.h : "");
    el.innerHTML = '<iframe src="' + src + '" title="' + label + '" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen></iframe>';
  });
}

const grid = document.getElementById("grid");
const filtri = document.getElementById("filtri");

function nomeCategoria(id) {
  const c = CATEGORIE.find(function (x) { return x.id === id; });
  return c ? c.nome : "";
}

function mostra(cat) {
  grid.innerHTML = "";
  LAVORI.filter(function (l) { return cat === "tutti" || l.categoria === cat; }).forEach(function (l) {
    const item = document.createElement("article");
    item.className = "clip";
    item.innerHTML = '<div class="frame"></div><span class="tag"></span><h3></h3><p></p>';
    item.querySelector(".tag").textContent = nomeCategoria(l.categoria);
    item.querySelector("h3").textContent = l.titolo;
    item.querySelector("p").textContent = l.dettaglio;
    buildFrame(item.querySelector(".frame"), l.yt, l.titolo, false, l.img);
    grid.appendChild(item);
  });
  filtri.querySelectorAll("button").forEach(function (b) {
    b.setAttribute("aria-pressed", b.dataset.cat === cat ? "true" : "false");
  });
}

const usate = CATEGORIE.filter(function (c) { return LAVORI.some(function (l) { return l.categoria === c.id; }); });
[{ id: "tutti", nome: "Tutti" }].concat(usate).forEach(function (c) {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = c.nome;
  b.dataset.cat = c.id;
  b.addEventListener("click", function () { mostra(c.id); });
  filtri.appendChild(b);
});

mostra("tutti");
</script>
</body>
</html>
